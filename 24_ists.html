<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hugo spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: skaņas bloku izskats */
.skana {
  background-color: #ff0015;
  border: 12px solid #d9ff00;
  padding: 16px;
  margin: 16px 0;
  box-sizing: border-box;
}
</style>
</head>
<body>
<h1>Nedominē vai dominē</h1>
<p>Noklausies spēles skaņas un saproti savu dominācijas līmeni.</p>
<div class="skana">
  <h2>Nedominēšanas skaņa.</h2>
  <p>Šo skaņu dzirdēsi, kad nedominēsi spēli.</p>
  <audio controls src="skanas/klikskis.wav"></audio>
</div>
<!-- ŠEIT OTRAIS SKAŅAS BLOKS --><div class="skana">
  <h2>Dominēšanas skaņa</h2>
  <p>Šo skaņu dzirdēsi, kad dominēsi spēli.</p>
  <audio controls src="skanas/klikskis.wav"></audio>
</div>
</body>
</html>
